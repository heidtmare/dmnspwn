<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head(${element.displayName()} + ' · literal expression')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>
<main class="page wide">
    <div th:replace="~{fragments/layout :: modelhead('drd')}"></div>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <datalist th:replace="~{fragments/layout :: types}"></datalist>

    <div class="element-head">
        <span class="kind big" th:classappend="${'kind-' + element.kind().slug()}" th:text="${element.kind().displayName()}">Decision</span>
        <h2 th:text="${element.displayName()}">Element</h2>
        <span class="muted">Literal expression</span>
        <span class="spacer"></span>
        <a class="tool" th:href="@{/models/{id}/elements/{e}/logic(id=${modelId},e=${element.id()},raw=true)}">Edit as XML</a>
        <a class="tool" th:href="@{/models/{id}/elements/{e}(id=${modelId},e=${element.id()})}">Done</a>
    </div>

    <section class="panel">
        <p th:if="${element.kind().name() == 'BUSINESS_KNOWLEDGE_MODEL'}">
            <code class="signature" th:text="${element.signature()}">f()</code></p>
        <div th:unless="${editMode}" class="expr-wrap">
            <th:block th:replace="~{fragments/expression :: expr(${literal})}"></th:block>
        </div>
        <form th:if="${editMode}" method="post" class="stack"
              th:action="@{/models/{id}/elements/{e}/logic/literal(id=${modelId},e=${element.id()})}">
            <label>FEEL expression
                <textarea name="text" rows="10" class="code" spellcheck="false" th:text="${literal.text()}"></textarea></label>
            <label>Result type <input name="typeRef" th:value="${literal.typeRef()}" list="type-options"></label>
            <div class="actions"><button type="submit" class="primary">Save</button></div>
        </form>
    </section>
</main>
</body>
</html>
