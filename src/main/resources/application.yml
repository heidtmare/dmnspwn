spring:
  application:
    name: dmnspwn
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  # Honour X-Forwarded-* from a load balancer / ingress (scheme, host, port).
  forward-headers-strategy: native
  servlet:
    session:
      tracking-modes: cookie
  tomcat:
    # Large decision tables are posted as one form.
    max-parameter-count: 20000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      # /actuator/health/liveness and /actuator/health/readiness
      probes:
        enabled: true

dmnspwn:
  # file: models in storage-directory (one instance only)
  # s3:   models, undo history and tests in the S3 bucket under s3.storage-prefix (any number of instances)
  storage: file
  storage-directory: ./dmn-models
  seed-samples: true
  history-size: 50
  # Optional S3 bucket for loading and publishing models, and for storage: s3. Credentials come from the AWS SDK
  # default provider chain (AWS_* env vars, ~/.aws profiles/SSO, container or instance roles).
  s3:
    enabled: false
    bucket:
    prefix: dmn/            # where models are loaded from and published to
    storage-prefix: dmnspwn/  # where storage: s3 keeps models; must not overlap prefix
    region:            # e.g. eu-west-1; empty = SDK default region chain
    endpoint:          # e.g. http://localhost:9000 for MinIO / LocalStack
    path-style: false  # true for most S3-compatible stores
    max-object-size: 10MB
    timeout: 30s
